<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55, #6a11cb);
            color: white;
            text-align: center;
        }

        .container {
            padding: 60px 20px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .welcome {
            font-size: 20px;
            margin-bottom: 40px;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .card {
            width: 220px;
            padding: 30px 20px;
            border-radius: 20px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .card h3 {
            margin-bottom: 20px;
        }

        .card a {
            display: inline-block;
            padding: 12px 20px;
            background: #ffd166;
            color: #222;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }

        .card a:hover {
            background: white;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🛡️ Admin Dashboard</h1>

    <div class="welcome">
        Welcome Admin 👋
    </div>

    <div class="cards">

        <div class="card">
            <h3>👥 Users</h3>
            <a href="/users">View All Users</a>
        </div>

        <div class="card">
            <h3>📋 Policies</h3>
            <a href="/view_policies">View All Policies</a>
        </div>

        <div class="card">
            <h3>📝 Claims</h3>
            <a href="/claims">View All Claims</a>
        </div>

    </div>

</div>

</body>
</html>
