<!DOCTYPE html>
<html>
<head>
    <title>Travel Sync - Apply Policy</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #00c6ff, #0072ff, #7f53ac);
        }

        .box {
            width: 430px;
            padding: 38px;
            background: rgba(255,255,255,0.96);
            border-radius: 22px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .icon {
            text-align: center;
            font-size: 42px;
            margin-bottom: 8px;
        }

        h2 {
            text-align: center;
            color: #1769aa;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
        }

        input:focus {
            border-color: #0072ff;
        }

        input[type="submit"] {
            border: none;
            border-radius: 25px;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #0072ff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="icon">✈️🛡️</div>

        <h2>Apply New Policy</h2>

        <form method="POST">

            <label>Name</label>
            <input type="text" name="name" required>

            <label>Destination</label>
            <input type="text" name="destination" required>

            <label>Travel Date</label>
            <input type="date" name="travel_date" required>

            <label>Travel Duration (Days)</label>
            <input type="number" name="days" min="1" required>

            <input type="submit" value="Apply for Policy">

        </form>

        <a class="back" href="/dashboard">← Back to Dashboard</a>

    </div>

</body>
</html>
