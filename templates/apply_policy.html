<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Sync - Apply Policy</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 30px 15px;

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #0072ff,
                    #7f53ac
                );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 500px;
            padding: 35px;

            background: rgba(255, 255, 255, 0.97);

            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .icon {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #1769aa;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;

            margin-bottom: 18px;

            border: 2px solid #ddd;
            border-radius: 10px;

            outline: none;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0072ff;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .section {
            margin-top: 10px;
            margin-bottom: 12px;

            color: #1769aa;
            font-size: 18px;
            font-weight: bold;
        }

        .submit {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 25px;

            background:
                linear-gradient(
                    90deg,
                    #00c6ff,
                    #0072ff
                );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .submit:hover {
            transform: translateY(-2px);
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #0072ff;

            text-decoration: none;

            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="icon">✈️🛡️</div>

        <h2>Apply for Insurance</h2>

        <p class="subtitle">
            Submit your insurance application
        </p>

        <form method="POST">

            <div class="section">
                Personal Details
            </div>

            <label>Name</label>
            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <label>Phone Number</label>
            <input
                type="tel"
                name="phone"
                placeholder="Enter phone number"
                required
            >

            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="Enter email address"
                required
            >

            <div class="section">
                Insurance Details
            </div>

            <label>Insurance Plan</label>

            <select name="plan_id" required>

                <option value="">
                    -- Select Insurance Plan --
                </option>

                <option value="1">
                    Health Insurance
                </option>

                <option value="2">
                    Life Insurance
                </option>

                <option value="3">
                    Vehicle Insurance
                </option>

            </select>

            <label>Destination</label>

            <input
                type="text"
                name="destination"
                placeholder="Enter destination"
                required
            >

            <label>Travel Date</label>

            <input
                type="date"
                name="travel_date"
                required
            >

            <label>Travel Duration (Days)</label>

            <input
                type="number"
                name="days"
                min="1"
                placeholder="Example: 10"
                required
            >

            <div class="section">
                Nominee Details
            </div>

            <label>Nominee Name</label>

            <input
                type="text"
                name="nominee_name"
                placeholder="Enter nominee name"
                required
            >

            <label>Nominee Phone</label>

            <input
                type="tel"
                name="nominee_phone"
                placeholder="Enter nominee phone"
                required
            >

            <label>Additional Information</label>

            <textarea
                name="additional_info"
                placeholder="Enter any additional information">
            </textarea>

            <input
                class="submit"
                type="submit"
                value="Submit Insurance Application"
            >

        </form>

        <a class="back" href="/dashboard">
            ← Back to Dashboard
        </a>

    </div>

</body>

</html>
