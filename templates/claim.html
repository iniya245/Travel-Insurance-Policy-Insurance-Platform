<!DOCTYPE html>
<html>
<head>
    <title>Travel Sync - Claim</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff416c, #ff4b2b, #f9d423);
        }

        .box {
            width: 430px;
            padding: 45px;
            text-align: center;
            background: rgba(255,255,255,0.96);
            border-radius: 22px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h2 {
            color: #e63946;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .back {
            display: inline-block;
            padding: 13px 28px;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="icon">🛡️🚨</div>

        <h2>Insurance Claim</h2>

        <p>
            Your insurance claim request has been submitted successfully.
        </p>

        <a class="back" href="/dashboard">← Back to Dashboard</a>

    </div>

</body>
</html>
