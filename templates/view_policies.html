<!DOCTYPE html>
<html>
<head>
    <title>View Policies</title>
</head>
<body>

<h2>My Travel Policies</h2>

<table border="1">
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Destination</th>
    <th>Travel Date</th>
</tr>

{% for p in policies %}
<tr>
    <td>{{ p[0] }}</td>
    <td>{{ p[1] }}</td>
    <td>{{ p[2] }}</td>
    <td>{{ p[3] }}</td>
</tr>
{% endfor %}

</table>

<br>

<a href="/dashboard">Back to Dashboard</a>

</body>
</html>
